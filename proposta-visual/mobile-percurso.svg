      .text-muted { fill: #95A59E; font-family: 'DM Sans', system-ui, -apple-system, sans-serif; }
      .text-dim { fill: #64756E; font-family: 'DM Sans', system-ui, -apple-system, sans-serif; }
      .text-green { fill: #00E676; font-family: 'DM Sans', system-ui, -apple-system, sans-serif; }
      .text-dark { fill: #05140C; font-family: 'DM Sans', system-ui, -apple-system, sans-serif; }
