<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1120" width="360" height="1120" role="img" aria-label="Prancha Visual Mobile 360px — Percurso Lead, Projeto, Squad, Subárea, Integrantes e Valor Médio">
  <defs>
    <linearGradient id="mBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0E0D"/>
      <stop offset="100%" stop-color="#080B0A"/>
    </linearGradient>
    <linearGradient id="mGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18231E" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0E1412" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="mActive" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E676" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0F291E" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="360" height="1120" fill="url(#mBg)"/>

  <!-- Mobile Topbar (360px, no horizontal scroll, starts with Leads -> Projetos) -->
  <rect x="0" y="0" width="360" height="96" fill="#0E1412"/>
  <line x1="0" y1="96" x2="360" y2="96" stroke="#1E2824"/>

  <rect x="14" y="12" width="58" height="24" rx="6" fill="#0F291E" stroke="#00E676"/>
  <text x="43" y="29" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="15" font-weight="700" font-style="italic" fill="#00E676">citi</text>
  <text x="80" y="28" font-family="DM Sans, sans-serif" font-size="12" font-weight="600" fill="#A3B3AC">central</text>
  <rect x="262" y="13" width="84" height="22" rx="4" fill="#0F291E" stroke="#1E4D38"/>
  <text x="304" y="28" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="9.5" font-weight="700" fill="#00E676">MOBILE 360PX</text>

  <!-- Mobile Nav Grid (Starts at 01 Leads, 02 Projetos) -->
  <g transform="translate(14, 46)">
    <rect x="0" y="0" width="332" height="40" rx="8" fill="#121916" stroke="#2A3832"/>
    <rect x="4" y="5" width="76" height="30" rx="6" fill="url(#mActive)" stroke="#00E676"/>
    <text x="42" y="24" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="10.5" font-weight="700" fill="#F1F5F3">01 Leads</text>
    <text x="122" y="24" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="10.5" font-weight="600" fill="#F1F5F3">02 Projetos</text>
    <text x="202" y="24" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="10.5" font-weight="500" fill="#A3B3AC">03 Subáreas</text>
    <text x="284" y="24" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="10.5" font-weight="600" fill="#00E676">∑ Médias</text>
  </g>

  <!-- 1. Compact 3D / Static Showcase on Mobile -->
  <g transform="translate(14, 110)">
    <rect x="0" y="0" width="332" height="168" rx="12" fill="url(#mGlass)" stroke="#2D3D36"/>
    <text x="14" y="22" font-family="DM Sans, sans-serif" font-size="9.5" font-weight="700" fill="#00E676" letter-spacing="1">● ESTEIRA 3D / FALLBACK ESTÁTICO</text>
    <text x="14" y="42" font-family="DM Sans, sans-serif" font-size="15" font-weight="700" fill="#F1F5F3">Lead → Projeto → Squad → Subárea → Integrantes</text>

    <rect x="14" y="54" width="304" height="32" rx="7" fill="url(#mActive)" stroke="#00E676"/>
    <text x="24" y="74" font-family="DM Sans, sans-serif" font-size="11.5" font-weight="700" fill="#F1F5F3">01. Lead (Contratante) → 02. Projeto (Discovery/Delivery)</text>

    <rect x="14" y="92" width="304" height="32" rx="7" fill="#131B18" stroke="#2A3832"/>
    <text x="24" y="112" font-family="DM Sans, sans-serif" font-size="11.5" font-weight="600" fill="#A3B3AC">03. Squad → 04. Subárea CITi → 05. Integrantes</text>

    <text x="14" y="148" font-family="DM Sans, sans-serif" font-size="10.5" fill="#A3B3AC">
      <tspan fill="#00E676" font-weight="700">Toque (:active) e Reduced Motion:</tspan> versão estática automática
    </text>
  </g>

  <!-- 2. Liquid Glass Filters + Average Value Card -->
  <g transform="translate(14, 292)">
    <rect x="0" y="0" width="332" height="236" rx="12" fill="url(#mGlass)" stroke="#2D3D36"/>
    <text x="14" y="22" font-family="DM Sans, sans-serif" font-size="10" font-weight="700" fill="#00E676" letter-spacing="1">FILTROS LIQUID GLASS &amp; VALOR MÉDIO</text>

    <rect x="14" y="32" width="304" height="34" rx="7" fill="#0C110F" stroke="#2D3D36"/>
    <text x="24" y="53" font-family="DM Sans, sans-serif" font-size="11.5" fill="#F1F5F3">Segmento Contratante: Todos (3) ▾</text>

    <rect x="14" y="72" width="148" height="34" rx="7" fill="#0C110F" stroke="#2D3D36"/>
    <text x="24" y="93" font-family="DM Sans, sans-serif" font-size="11" fill="#F1F5F3">Discovery + Delivery ▾</text>

    <rect x="170" y="72" width="148" height="34" rx="7" fill="#0C110F" stroke="#2D3D36"/>
    <text x="180" y="93" font-family="DM Sans, sans-serif" font-size="11" fill="#F1F5F3">Subárea: Todas ▾</text>

    <rect x="14" y="114" width="304" height="34" rx="7" fill="#0F291E" stroke="#00E676"/>
    <text x="24" y="135" font-family="DM Sans, sans-serif" font-size="11.5" font-weight="700" fill="#F1F5F3">Agrupar: Subárea CITi + Segmento ▾</text>

    <line x1="14" y1="160" x2="318" y2="160" stroke="#1E2824"/>
    <text x="14" y="182" font-family="DM Sans, sans-serif" font-size="11" fill="#A3B3AC">Valor Médio Contratado (Recorte):</text>
    <text x="195" y="183" font-family="DM Sans, sans-serif" font-size="18" font-weight="700" fill="#00E676">R$ 54.000,00</text>
    <text x="14" y="202" font-family="DM Sans, sans-serif" font-size="11" fill="#F1F5F3">Base: 3 de 5 projetos elegíveis</text>
    <text x="14" y="220" font-family="DM Sans, sans-serif" font-size="10.5" fill="#F5B942">Excluídos: 1 sem valor · 1 sem contrato</text>
  </g>

  <!-- 3. Project + Squad + Subárea + Integrantes Stack on Mobile -->
  <g transform="translate(14, 542)">
    <rect x="0" y="0" width="332" height="548" rx="12" fill="url(#mGlass)" stroke="#00E676"/>
    <text x="16" y="24" font-family="DM Sans, sans-serif" font-size="10" font-weight="700" fill="#00E676" letter-spacing="1">PROJETO SELECIONADO &amp; SQUAD</text>
    <text x="16" y="48" font-family="DM Sans, sans-serif" font-size="19" font-weight="700" fill="#F1F5F3">Plataforma Maré</text>

    <rect x="16" y="58" width="68" height="20" rx="4" fill="#123035" stroke="#5CE1E6"/>
    <text x="50" y="72" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="9.5" font-weight="700" fill="#5CE1E6">DELIVERY</text>

    <rect x="92" y="58" width="96" height="20" rx="4" fill="#0F291E" stroke="#00E676"/>
    <text x="140" y="72" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="9.5" font-weight="700" fill="#00E676">R$ 54.000,00</text>

    <line x1="16" y1="90" x2="316" y2="90" stroke="#1E2824"/>
    <text x="16" y="110" font-family="DM Sans, sans-serif" font-size="11" fill="#A3B3AC">Empresa Contratante (Filtro Comercial)</text>
    <text x="16" y="128" font-family="DM Sans, sans-serif" font-size="13" font-weight="700" fill="#F1F5F3">Banco Atlântico S.A. · Finanças &amp; Pagamentos</text>

    <line x1="16" y1="142" x2="316" y2="142" stroke="#1E2824"/>
    <text x="16" y="162" font-family="DM Sans, sans-serif" font-size="11" fill="#A3B3AC">Lead de Origem (Vínculo 1:1)</text>
    <text x="16" y="180" font-family="DM Sans, sans-serif" font-size="13" font-weight="700" fill="#00E676">← Abrir Lead Plataforma Maré</text>

    <!-- Squad Card inside Project -->
    <rect x="16" y="198" width="300" height="278" rx="10" fill="#0C110F" stroke="#1E4D38"/>
    <text x="28" y="220" font-family="DM Sans, sans-serif" font-size="10" font-weight="700" fill="#00E676">ETAPA 03 · SQUAD ALOCADO</text>
    <text x="28" y="240" font-family="DM Sans, sans-serif" font-size="16" font-weight="700" fill="#F1F5F3">Squad Maré</text>
    <text x="28" y="258" font-family="DM Sans, sans-serif" font-size="12" font-weight="700" fill="#00E676">Subárea CITi: Desenvolvimento →</text>

    <!-- Responsible 1 -->
    <rect x="28" y="272" width="276" height="54" rx="7" fill="#131B18" stroke="#26332E"/>
    <text x="40" y="294" font-family="DM Sans, sans-serif" font-size="12.5" font-weight="700" fill="#F1F5F3">Clara Luz (Responsável)</text>
    <text x="40" y="312" font-family="DM Sans, sans-serif" font-size="11" fill="#A3B3AC">Tech Lead · Subárea: Desenvolvimento</text>

    <!-- Member 2 -->
    <rect x="28" y="334" width="276" height="54" rx="7" fill="#131B18" stroke="#26332E"/>
    <text x="40" y="356" font-family="DM Sans, sans-serif" font-size="12.5" font-weight="700" fill="#F1F5F3">Bruno Melo (Integrante do Squad)</text>
    <text x="40" y="374" font-family="DM Sans, sans-serif" font-size="11" fill="#A3B3AC">Full-Stack · Subárea: Desenvolvimento</text>

    <!-- Member 3 -->
    <rect x="28" y="396" width="276" height="54" rx="7" fill="#131B18" stroke="#26332E"/>
    <text x="40" y="418" font-family="DM Sans, sans-serif" font-size="12.5" font-weight="700" fill="#F1F5F3">Ana Lima (Integrante do Squad)</text>
    <text x="40" y="436" font-family="DM Sans, sans-serif" font-size="11" fill="#A3B3AC">Estrategista IA · Subárea: Inovação</text>

    <!-- Full-width Touch CTA -->
    <rect x="16" y="492" width="300" height="42" rx="8" fill="#00E676"/>
    <text x="166" y="518" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="12.5" font-weight="700" fill="#04140B">Explorar Subárea &amp; Integrantes →</text>
  </g>
</svg>
